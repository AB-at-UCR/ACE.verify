[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceverify"
version = "0.1.0"
description = "Deepfake verification toolkit"
requires-python = ">=3.10,<3.13"
dependencies = [
	"numpy>=1.24",
	"h5py>=3.9",
	"torch>=2.2",
	"torchvision>=0.17",
	"torchaudio>=2.2",
	"timm>=0.9",
	"scikit-learn>=1.3",
	"matplotlib>=3.8",
	"ffmpeg-python>=0.2",
	"facenet-pytorch>=2.5",
	"Pillow>=10.0",
	"scipy>=1.11",
]

[project.scripts]
aceverify-train = "aceverify.train:main"
aceverify-preprocess = "aceverify.preprocess:main"
aceverify-evaluate = "ops.evaluate:main"

[tool.setuptools]
packages = ["aceverify", "ops"]

[tool.setuptools.package-dir]
aceverify = "."