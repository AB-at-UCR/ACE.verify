apiVersion: batch/v1
kind: Job
metadata:
  name: aceverify-eval
  labels:
    user: abhar061
    project: aceverify
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        user: abhar061
        project: aceverify
    spec:
      restartPolicy: Never
      containers:
        - name: aceverify
          image: adityabhardwaj24/ace_verify:latest
          workingDir: /workspace
          env:
            - name: PYTHONPATH
              value: /workspace
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          command:
            - python
            - -u
            - -m
            - evaluation.evaluate
            - --h5
            - /workspace/data/test_data.h5
            - --checkpoint
            - /workspace/results/aceverify_final.pth
            - --batch-size
            - "8"
            - --num-workers
            - "0"
          volumeMounts:
            - mountPath: /workspace
              name: workspace
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: aceverify-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-RTX-A6000
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-A40
                      - NVIDIA-A10
                      - NVIDIA-RTX-A5000
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
